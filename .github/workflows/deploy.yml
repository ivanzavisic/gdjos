name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        # 🚨 EMPTY ON PURPOSE SINCE 2026-09-06 — the site is served from the CUSTOM DOMAIN
        # gamedevjug.org, which serves from the ROOT.
        #
        # This used to be `/${{ github.event.repository.name }}` (i.e. `/gdjos`), which was correct while
        # the only URL was ivanzavisic.github.io/gdjos/. On a custom domain that prefix is wrong in a
        # way that is easy to miss: the HTML still loads, but every asset and internal link resolves to
        # gamedevjug.org/gdjos/... and 404s. The page renders unstyled and nothing navigates.
        #
        # ⚠️ If the custom domain is ever removed, put the prefix back or the github.io URL breaks the
        # same way in reverse. The two are mutually exclusive.
        env:
          BASE_PATH: ''
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
